<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <!-- A site panel (tinted, scanlined, thin border, corner ticks) holding the lens-streak star -->
  <defs>
    <pattern id="scan" width="32" height="0.8" patternUnits="userSpaceOnUse">
      <rect width="32" height="0.27" fill="#fff" fill-opacity="0.045"/>
    </pattern>
    <radialGradient id="glow">
      <stop offset="0" stop-color="#fff"/>
      <stop offset="0.3" stop-color="#fff" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="streak">
      <stop offset="0" stop-color="#fff" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#fff"/>
      <stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <rect width="32" height="32" fill="#161616"/>
  <rect x="3" y="3" width="26" height="26" fill="#232323"/>
  <rect x="3" y="3" width="26" height="26" fill="url(#scan)"/>
  <rect x="3.3" y="3.3" width="25.4" height="25.4" fill="none" stroke="#4d4d4d" stroke-width="0.6"/>
  <path d="M2.2 2.2h1.4v2.4H2.2zM28.4 2.2h1.4v2.4h-1.4zM2.2 27.4h1.4v2.4H2.2zM28.4 27.4h1.4v2.4h-1.4z" fill="#fafafa"/>
  <rect x="6" y="15.45" width="20" height="1.1" fill="url(#streak)"/>
  <circle cx="16" cy="16" r="5.2" fill="url(#glow)"/>
  <circle cx="16" cy="16" r="2" fill="#fff"/>
</svg>
