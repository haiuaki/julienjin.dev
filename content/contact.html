<!-- Contact content, loaded by js/menu.js. A single page, no list:
     one <article>, its content is the page text.

     Details shown above the text (each optional, in this order):
       data-status     STATUS
       data-based      BASED
       data-replies    REPLIES
       data-preferred  PREFERRED
       data-timezone   not shown itself: an IANA time zone (e.g. Europe/Paris)
                       whose current time is shown after BASED, summer time
                       included

     To add a detail, write it on the article: data-key="…".
     To make a new key, add ['LABEL', 'key'] to this section's fields in
     MENUS (js/menu.js). -->

<article id="contact"
         data-status="Available (Full-time / Internship)"
         data-based="Paris"
         data-timezone="Europe/Paris"
         data-replies="Within 48h"
         data-preferred="Email">
    <p>Currently looking for a full-time software engineering position or a 4–6 month internship. Feel free to reach out about opportunities, collaborations, or questions about any of my projects.</p>
    <!-- The links themselves live in index.html (#contact-channels),
         where the no-JS window shows them too -->
    <div data-copy-of="contact-channels"></div>
</article>
