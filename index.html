<!doctype html>
<html lang="en">
<head>
    <!-- --- METADATA & RESOURCES --- -->
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="author" content="Julien Jin">

    <title>Julien Jin</title>
    
    <!-- Google Fonts: IBM Plex Mono -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@300;400;500;600&display=swap" rel="stylesheet">
    
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <!-- Home window: name and role in its title bar, one row per planet (js/home.js).
         First in the page so Tab and screen readers reach the sections first;
         its position on screen is set in CSS. -->
    <nav id="home-nav" aria-label="Site sections">
        <section id="home-window" class="term-window flicker-window" data-open="flicker">
            <div class="window-bar">
                <span class="bar-line bar-edge"></span>
                <div class="window-header"></div>
                <span class="bar-line"></span>
                <div class="window-meta"></div>
                <span class="bar-line bar-edge"></span>
            </div>
            <div class="flicker-frame"></div>
            <div class="corner corner-tl"></div>
            <div class="corner corner-tr"></div>
            <div class="corner corner-bl"></div>
            <div class="corner corner-br"></div>
            <div class="window-content"></div>
        </section>
    </nav>

    <!-- --- 3D SOLAR SYSTEM NAVIGATION --- -->
    <!-- --- TARGETING CROSSHAIRS --- -->
    <div id="crosshair-x"></div>
    <div id="crosshair-y"></div>

    <header id="space-container">

        <!-- Main coordinate anchor -->
        <div id="solar-system">

            <!-- Interactive sun / time switch: a star with a lens streak that retracts when time halts -->
            <button id="sun-btn" class="circle-btn size-large" aria-label="Halt or resume time">
                <span class="sun-streak"></span>
            </button>

            <!-- Orbital navigation rings -->
            <nav id="main-nav">
                
                <!-- Main Navigation Planets -->
                <div class="orbit-ring planet-1">
                    <button class="astre-btn size-small bg-theme" data-label="[info]" data-menu="info"></button>
                </div>
                
                <div class="orbit-ring planet-2">
                    <button class="astre-btn size-small bg-theme" data-label="[projects]" data-menu="projects"></button>
                </div>
                
                <div class="orbit-ring planet-3">
                    <button class="astre-btn size-small bg-theme" data-label="[lab]" data-menu="lab"></button>
                </div>

                <div class="orbit-ring planet-4">
                    <button class="astre-btn size-small bg-theme" data-label="[contact]" data-menu="contact"></button>
                </div>

                <!-- Decorative Comet Trails -->
				<div class="orbit-ring comet-1"></div>
				<div class="orbit-ring comet-2"></div>
				<div class="orbit-ring comet-3"></div>

            </nav>
        </div>
    </header>

    <!-- --- TIME STATUS --- -->
    <div id="time-status" aria-live="polite">[ TIME HALTED ]</div>

    <!-- CONTENT WINDOWS (BOUNDING BOXES) -->
    <!-- Each .term-window types its header, then opens its 4-corner frame independently.
         Both size to their content; the row lays them out side by side. -->
    <div id="window-row">

        <!-- Main window: menu index, or a planet's own content.
             data-open picks the opening: "flicker" (CRT power-on), or remove it and
             use class "corner-window" with a bare .window-header and the panel-clip
             markup for the corner unfold. -->
        <section id="content-window" class="term-window flicker-window" data-open="flicker">
            <!-- Title bar: the title and meta slot are cut into the frame's top border -->
            <div class="window-bar">
                <span class="bar-line bar-edge"></span>
                <div class="window-header"></div>
                <span class="bar-line"></span>
                <div class="window-meta"></div>
                <span class="bar-line bar-edge"></span>
            </div>
            <div class="flicker-frame"></div>
            <div class="corner corner-tl"></div>
            <div class="corner corner-tr"></div>
            <div class="corner corner-bl"></div>
            <div class="corner corner-br"></div>
            <div class="window-content">
                <!-- Menu index is rendered in here by js/menu.js -->
            </div>
        </section>

        <!-- Reader window: opens beside the index when an entry is picked.
             Powers on with a flicker instead of the corner unfolding. -->
        <section id="reader-window" class="term-window flicker-window" data-open="flicker">
            <!-- Title bar: the title and meta slot are cut into the frame's top border -->
            <div class="window-bar">
                <span class="bar-line bar-edge"></span>
                <div class="window-header"></div>
                <span class="bar-line"></span>
                <div class="window-meta"></div>
                <span class="bar-line bar-edge"></span>
            </div>
            <div class="flicker-frame"></div>
            <div class="corner corner-tl"></div>
            <div class="corner corner-tr"></div>
            <div class="corner corner-bl"></div>
            <div class="corner corner-br"></div>
            <div class="window-content">
                <!-- Entry content is cloned in here by js/menu.js -->
            </div>
        </section>

    </div>

    <!-- --- MENU ENTRY CONTENT --- -->
    <!-- EXAMPLE CONTENT: everything in [brackets] is a placeholder to replace. -->

    <!-- [info] -->
    <template id="entry-profile">
        <p>[Two or three sentences in your own voice: what you build, what you care about in your work, and what kind of team or problem you are looking for next.]</p>
        <p>[One sentence on something outside work that says something about you.]</p>
    </template>
    <template id="entry-trajectory">
        <ol class="timeline">
            <li><span class="tl-when">2024 — NOW</span><span class="tl-what">Software engineer · [Company]</span><span class="tl-note">[What you own there and one result you are proud of.]</span></li>
            <li><span class="tl-when">2022 — 2024</span><span class="tl-what">[Role] · [Company]</span><span class="tl-note">[One line on the work and its impact.]</span></li>
            <li><span class="tl-when">2019 — 2022</span><span class="tl-what">[Degree] · [School]</span><span class="tl-note">[Focus, thesis or standout project.]</span></li>
        </ol>
    </template>
    <template id="entry-now">
        <ul class="now-list">
            <li>Building this site: a navigable solar system with a time switch.</li>
            <li>Learning [topic you are currently studying].</li>
            <li>Reading [book or paper].</li>
        </ul>
    </template>

    <!-- [lab] -->
    <template id="entry-lens-star">
        <p>Four rounds of studies for the star at the center of this site: a pulsing glow, an eclipse, shaded spheres, mist particles, eight diffraction stars and five black holes, before settling on a single horizontal lens streak.</p>
        <p>Every candidate was drawn live at its real on-screen size next to an orbit, with a switch to compare its "time halted" state.</p>
    </template>
    <template id="entry-black-hole">
        <p>A physically based black hole drawn on a 2D canvas. The disk's shape comes from light bending around the hole (Beloborodov's approximation), its brightness from Doppler beaming and gravitational redshift, and background stars are lensed into arcs.</p>
        <p>The disk is rendered once at high density; only orbiting hot spots and stars move each frame.</p>
    </template>
    <template id="entry-time-stop">
        <p>Click anywhere on the home page to halt time. A shockwave sweeps the starfield from the click point, the orbits lurch backwards before locking still, and the star's streak retracts into its core.</p>
        <p>Built with the Web Animations API (orbit playback rates) and an on-demand canvas, so nothing renders while the scene is still.</p>
    </template>
    <template id="entry-next-experiment">
        <p>[A small prototype or study: what question it explores, what you tried, and what you learned. Link a live demo if there is one.]</p>
    </template>

    <!-- [contact]: a single page, no list -->
    <template id="page-contact">
        <p>[One line inviting people to reach out, and for what: roles, collaborations, questions about a project.]</p>
        <dl class="dossier-fields channels">
            <div class="dossier-field"><dt>EMAIL</dt><dd><a href="mailto:name@example.com">name@example.com</a></dd></div>
            <div class="dossier-field"><dt>GITHUB</dt><dd><a href="https://github.com/">github.com/[handle]</a></dd></div>
            <div class="dossier-field"><dt>LINKEDIN</dt><dd><a href="https://www.linkedin.com/">linkedin.com/in/[handle]</a></dd></div>
            <div class="dossier-field"><dt>CV</dt><dd><a href="cv.pdf">[cv.pdf]</a></dd></div>
        </dl>
    </template>

    <!-- Body text only: title and dossier fields come from the registry -->
